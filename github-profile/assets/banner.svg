<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="waveFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.4"/>
    </linearGradient>

    <style>
      @keyframes waveAnim {
        0% { d: path("M 0 170 Q 225 140 450 170 T 900 170 L 900 220 L 0 220 Z"); }
        50% { d: path("M 0 155 Q 225 185 450 155 T 900 165 L 900 220 L 0 220 Z"); }
        100% { d: path("M 0 170 Q 225 140 450 170 T 900 170 L 900 220 L 0 220 Z"); }
      }
      .wave-path { animation: waveAnim 8s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="900" height="220" rx="16" fill="url(#headerGrad)"/>

  <path class="wave-path" fill="#FFFFFF" fill-opacity="0.25" d="M 0 170 Q 225 140 450 170 T 900 170 L 900 220 L 0 220 Z"/>
  <path class="wave-path" style="animation-delay: -4s;" fill="#FFFFFF" fill-opacity="0.4" d="M 0 180 Q 225 160 450 185 T 900 175 L 900 220 L 0 220 Z"/>

  <text x="450" y="125" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" text-anchor="middle" letter-spacing="2">
    Mahendra Naidu
  </text>
</svg>
