<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="70%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.25"/>
    </linearGradient>

    <filter id="crispGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <style>
      @keyframes floatDot {
        0%, 100% { transform: translateY(0px); opacity: 0.4; }
        50% { transform: translateY(-10px); opacity: 0.9; }
      }
      @keyframes waveMotion {
        0% { d: path("M 0 260 Q 225 230 450 260 T 900 260 L 900 320 L 0 320 Z"); }
        50% { d: path("M 0 245 Q 225 275 450 240 T 900 255 L 900 320 L 0 320 Z"); }
        100% { d: path("M 0 260 Q 225 230 450 260 T 900 260 L 900 320 L 0 320 Z"); }
      }
      .dot1 { animation: floatDot 4s ease-in-out infinite; }
      .dot2 { animation: floatDot 6s ease-in-out infinite 1.5s; }
      .wave { animation: waveMotion 9s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="900" height="320" rx="20" fill="#090D16"/>
  <rect width="900" height="320" rx="20" fill="url(#bgGlow1)"/>
  <rect width="900" height="320" rx="20" fill="url(#bgGlow2)"/>
  <rect width="900" height="320" rx="20" fill="url(#grid)"/>

  <rect x="16" y="16" width="868" height="288" rx="16" fill="#0F172A" fill-opacity="0.6" stroke="url(#borderGradient)" stroke-width="1.5"/>

  <path class="wave" fill="url(#waveGradient)" d="M 0 260 Q 225 230 450 260 T 900 260 L 900 320 L 0 320 Z"/>

  <circle cx="100" cy="70" r="2.5" fill="#60A5FA" class="dot1"/>
  <circle cx="240" cy="120" r="2" fill="#A78BFA" class="dot2"/>
  <circle cx="780" cy="80" r="3" fill="#22D3EE" class="dot1"/>
  <circle cx="820" cy="200" r="2" fill="#38BDF8" class="dot2"/>
  <circle cx="80" cy="210" r="2.5" fill="#34D399" class="dot1"/>

  <g transform="translate(450, 55)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1E293B" fill-opacity="0.9" stroke="#3B82F6" stroke-opacity="0.6" stroke-width="1"/>
    <circle cx="-110" cy="0" r="4" fill="#10B981"/>
    <text x="-95" y="4" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2">
      WELCOME TO MY DEV PROFILE
    </text>
  </g>

  <g transform="translate(450, 135)" text-anchor="middle">
    <text y="0" fill="url(#titleGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="2" filter="url(#crispGlow)">
      MAHENDRA NAIDU MEESALA
    </text>

    <text y="36" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="3">
      FULL STACK MERN DEVELOPER <tspan fill="#06B6D4">•</tspan> AI ENTHUSIAST
    </text>
  </g>

  <g transform="translate(450, 230)">
    <g transform="translate(-230, 0)">
      <rect x="0" y="-15" width="140" height="30" rx="15" fill="#0A66C2" fill-opacity="0.25" stroke="#0A66C2" stroke-width="1.2"/>
      <path d="M 22 -3 L 22 6 M 22 -7 L 22 -6 M 27 6 L 27 1 M 27 1 Q 27 -3 30 -3 Q 33 -3 33 1 L 33 6" stroke="#0A66C2" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="75" y="4" fill="#60A5FA" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">LinkedIn</text>
    </g>

    <g transform="translate(-70, 0)">
      <rect x="0" y="-15" width="140" height="30" rx="15" fill="#E4405F" fill-opacity="0.25" stroke="#E4405F" stroke-width="1.2"/>
      <rect x="18" y="-7" width="14" height="14" rx="4" fill="none" stroke="#E4405F" stroke-width="1.5"/>
      <circle cx="25" cy="0" r="3" fill="none" stroke="#E4405F" stroke-width="1.5"/>
      <text x="75" y="4" fill="#F472B6" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Instagram</text>
    </g>

    <g transform="translate(90, 0)">
      <rect x="0" y="-15" width="140" height="30" rx="15" fill="#06B6D4" fill-opacity="0.25" stroke="#06B6D4" stroke-width="1.2"/>
      <rect x="18" y="-6" width="14" height="10" rx="2" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
      <path d="M 18 -5 L 25 0 L 32 -5" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="75" y="4" fill="#22D3EE" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Email Me</text>
    </g>
  </g>
</svg>
