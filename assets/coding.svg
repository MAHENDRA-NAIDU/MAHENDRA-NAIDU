<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <radialGradient id="deskBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <style>
      @keyframes codeScroll1 {
        0%, 100% { transform: translateY(0px); opacity: 1; }
        50% { transform: translateY(-6px); opacity: 0.6; }
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes floatDot {
        0%, 100% { transform: translateY(0px); opacity: 0.4; }
        50% { transform: translateY(-10px); opacity: 0.9; }
      }
      .code1 { animation: codeScroll1 4s ease-in-out infinite; }
      .code2 { animation: codeScroll1 5s ease-in-out infinite 1s; }
      .cur { animation: cursorBlink 0.8s infinite; fill: #06B6D4; }
      .dot1 { animation: floatDot 3s ease-in-out infinite; }
      .dot2 { animation: floatDot 4.5s ease-in-out infinite 1.5s; }
    </style>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Light Backing -->
  <rect width="500" height="320" rx="16" fill="#090D16"/>
  <circle cx="250" cy="160" r="200" fill="url(#deskBgGlow)"/>

  <!-- Ambient Stars -->
  <circle cx="60" cy="50" r="3" fill="#60A5FA" class="dot1"/>
  <circle cx="440" cy="70" r="2.5" fill="#A78BFA" class="dot2"/>
  <circle cx="40" cy="240" r="2" fill="#22D3EE" class="dot2"/>
  <circle cx="460" cy="220" r="3" fill="#34D399" class="dot1"/>

  <!-- Main Monitor Setup (Dual Screen Glass IDE) -->

  <!-- Left Screen (Code Editor) -->
  <g transform="translate(40, 50)">
    <!-- Frame -->
    <rect width="200" height="150" rx="10" fill="url(#laptopGrad)" stroke="#334155" stroke-width="2" filter="url(#softGlow)"/>
    <rect x="6" y="6" width="188" height="138" rx="6" fill="#0B0F19"/>
    <!-- IDE Header -->
    <rect x="6" y="6" width="188" height="20" fill="#1E293B" rx="6"/>
    <circle cx="18" cy="16" r="3" fill="#EF4444"/>
    <circle cx="28" cy="16" r="3" fill="#F59E0B"/>
    <circle cx="38" cy="16" r="3" fill="#10B981"/>
    <text x="48" y="19" fill="#94A3B8" font-family="monospace" font-size="9">App.jsx - MERN</text>

    <!-- Code Display -->
    <g transform="translate(15, 36)">
      <line class="code1" x1="0" y1="10" x2="90" y2="10" stroke="#F472B6" stroke-width="2.5" stroke-linecap="round"/>
      <line class="code2" x1="0" y1="22" x2="130" y2="22" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
      <line class="code1" x1="15" y1="34" x2="110" y2="34" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
      <line class="code2" x1="30" y1="46" x2="140" y2="46" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
      <line class="code1" x1="15" y1="58" x2="95" y2="58" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round"/>
      <line class="code2" x1="0" y1="70" x2="70" y2="70" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
      <rect class="cur" x="74" y="65" width="6" height="9" rx="1"/>
    </g>

    <!-- Stand Base -->
    <rect x="90" y="150" width="20" height="25" fill="#334155"/>
    <ellipse cx="100" cy="177" rx="35" ry="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  </g>

  <!-- Right Screen (Live Preview / Terminal) -->
  <g transform="translate(260, 50)">
    <rect width="200" height="150" rx="10" fill="url(#laptopGrad)" stroke="#334155" stroke-width="2" filter="url(#softGlow)"/>
    <rect x="6" y="6" width="188" height="138" rx="6" fill="#0F172A"/>
    <!-- Header -->
    <rect x="6" y="6" width="188" height="20" fill="#1E293B" rx="6"/>
    <circle cx="18" cy="16" r="3" fill="#EF4444"/>
    <circle cx="28" cy="16" r="3" fill="#F59E0B"/>
    <circle cx="38" cy="16" r="3" fill="#10B981"/>
    <text x="48" y="19" fill="#94A3B8" font-family="monospace" font-size="9">terminal@zsh</text>

    <!-- Terminal Content -->
    <g transform="translate(15, 40)">
      <text x="0" y="10" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold">~$ npm run dev</text>
      <text x="0" y="28" fill="#10B981" font-family="monospace" font-size="10">> Local: http://localhost:5173/</text>
      <text x="0" y="46" fill="#A78BFA" font-family="monospace" font-size="10">> Compiled in 240ms</text>

      <!-- Live Glowing Chart Representation -->
      <path d="M 0 80 Q 40 50 80 75 T 160 55" fill="none" stroke="#06B6D4" stroke-width="2"/>
      <circle cx="160" cy="55" r="4" fill="#06B6D4" filter="url(#softGlow)"/>
    </g>

    <!-- Stand Base -->
    <rect x="90" y="150" width="20" height="25" fill="#334155"/>
    <ellipse cx="100" cy="177" rx="35" ry="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  </g>

  <!-- Workstation Table Surface -->
  <path d="M 20 230 L 480 230 L 490 280 L 10 280 Z" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <line x1="20" y1="230" x2="480" y2="230" stroke="#06B6D4" stroke-opacity="0.8" stroke-width="2" filter="url(#softGlow)"/>

  <!-- Coffee Cup on Desk -->
  <g transform="translate(420, 240)">
    <rect x="0" y="0" width="18" height="22" rx="3" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
    <path d="M 18 4 C 23 4 23 16 18 16" fill="none" stroke="#38BDF8" stroke-width="1.2"/>
  </g>

  <!-- Keyboard on Desk -->
  <g transform="translate(180, 245)">
    <rect x="0" y="0" width="140" height="18" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <rect x="8" y="3" width="124" height="12" rx="2" fill="#1E293B" stroke="#8B5CF6" stroke-width="0.8" stroke-opacity="0.8"/>
  </g>
</svg>
