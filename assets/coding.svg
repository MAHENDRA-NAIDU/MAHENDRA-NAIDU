<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <!-- Background Shadow -->
  <ellipse cx="250" cy="270" rx="200" ry="12" fill="#E2E8F0" fill-opacity="0.6"/>

  <!-- Waste Bin (Right) -->
  <g transform="translate(420, 220)">
    <rect x="0" y="0" width="28" height="36" rx="4" fill="#3B82F6" fill-opacity="0.8" stroke="#1D4ED8" stroke-width="1.5"/>
    <line x1="6" y1="0" x2="6" y2="36" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="14" y1="0" x2="14" y2="36" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="22" y1="0" x2="22" y2="36" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
  </g>

  <!-- Desk Structure -->
  <line x1="30" y1="170" x2="380" y2="170" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="170" x2="50" y2="270" stroke="#64748B" stroke-width="3"/>
  <line x1="200" y1="170" x2="200" y2="270" stroke="#64748B" stroke-width="3"/>
  <line x1="360" y1="170" x2="360" y2="270" stroke="#64748B" stroke-width="3"/>

  <!-- Left Monitor 1 -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="85" height="55" rx="4" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="4" y="4" width="77" height="47" rx="2" fill="#38BDF8" fill-opacity="0.9"/>
    <!-- Code lines representation -->
    <line x1="10" y1="12" x2="45" y2="12" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="10" y1="20" x2="65" y2="20" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="10" y1="28" x2="55" y2="28" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="10" y1="36" x2="40" y2="36" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Stand -->
    <rect x="36" y="55" width="12" height="12" fill="#475569"/>
    <ellipse cx="42" cy="67" rx="18" ry="4" fill="#334155"/>
  </g>

  <!-- Center Monitor 2 -->
  <g transform="translate(155, 110)">
    <rect x="0" y="0" width="90" height="55" rx="4" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="4" y="4" width="82" height="47" rx="2" fill="#0284C7"/>
    <!-- Code layout -->
    <rect x="8" y="8" width="30" height="38" rx="2" fill="#0F172A" fill-opacity="0.5"/>
    <rect x="42" y="8" width="40" height="38" rx="2" fill="#0F172A" fill-opacity="0.5"/>
    <!-- Stand -->
    <rect x="38" y="55" width="12" height="12" fill="#475569"/>
    <ellipse cx="44" cy="67" rx="20" ry="4" fill="#334155"/>
  </g>

  <!-- Floating Gear Node Icon -->
  <g transform="translate(290, 80)">
    <rect x="0" y="0" width="40" height="30" rx="4" fill="#2563EB"/>
    <circle cx="15" cy="15" r="5" fill="#FFFFFF"/>
    <circle cx="26" cy="15" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Developer Character & Ergonomic Chair -->
  <!-- Chair Backrest -->
  <rect x="310" y="120" width="40" height="60" rx="10" fill="#334155"/>
  <!-- Chair Seat -->
  <rect x="290" y="170" width="65" height="12" rx="4" fill="#1E293B"/>
  <!-- Chair Base & Wheels -->
  <line x1="330" y1="182" x2="330" y2="245" stroke="#334155" stroke-width="5"/>
  <line x1="300" y1="245" x2="360" y2="245" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <circle cx="300" cy="250" r="3" fill="#0F172A"/>
  <circle cx="360" cy="250" r="3" fill="#0F172A"/>

  <!-- Developer Person Body -->
  <!-- Head & Glasses -->
  <circle cx="280" cy="115" r="16" fill="#FDBA74"/>
  <!-- Hair -->
  <path d="M 264 112 C 264 96 295 96 295 112 Z" fill="#1E293B"/>
  <!-- Glasses -->
  <circle cx="274" cy="114" r="4" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <circle cx="284" cy="114" r="4" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <line x1="278" y1="114" x2="280" y2="114" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Torso (Shirt) -->
  <path d="M 265 130 Q 280 128 295 130 L 300 180 L 260 180 Z" fill="#2563EB"/>
  
  <!-- Arms Typing towards Keyboard -->
  <path d="M 270 135 L 245 160 L 230 160" fill="none" stroke="#FDBA74" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 290 135 L 255 162 L 235 162" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Legs & Shoes -->
  <path d="M 270 180 L 260 215 L 275 255" fill="none" stroke="#1E293B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shoes -->
  <rect x="268" y="250" width="22" height="10" rx="3" fill="#0F172A"/>
</svg>
