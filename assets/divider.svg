<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 40" width="100%" height="100%">
  <defs>
    <linearGradient id="divGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="25%" stop-color="#2563EB" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="1"/>
      <stop offset="75%" stop-color="#7C3AED" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>

    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.4); opacity: 1; }
      }
      .node { transform-origin: center; animation: pulseNode 3s ease-in-out infinite; }
    </style>
  </defs>

  <g transform="translate(0, 20)">
    <!-- Base Glow Line -->
    <line x1="50" y1="0" x2="800" y2="0" stroke="url(#divGradient)" stroke-width="2" filter="url(#neonGlow)"/>

    <!-- Center Glowing Diamond Node -->
    <g transform="translate(425, 0)">
      <polygon class="node" points="0,-8 8,0 0,8 -8,0" fill="#06B6D4" filter="url(#neonGlow)"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
