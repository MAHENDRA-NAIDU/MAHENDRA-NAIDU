<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%">
  <defs>
    <radialGradient id="statGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="statGlow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="blueCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="greenTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="850" height="360" rx="16" fill="#0B0F19"/>
  <rect width="850" height="360" rx="16" fill="url(#statGlow1)"/>
  <rect width="850" height="360" rx="16" fill="url(#statGlow2)"/>
  <rect width="850" height="360" rx="16" fill="url(#gridPattern)"/>

  <!-- Card 1: Core Developer Stats (Left) -->
  <g transform="translate(25, 25)">
    <rect width="380" height="310" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1.5"/>
    
    <!-- Title -->
    <text x="25" y="40" fill="#60A5FA" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" filter="url(#glow)">⚡ Developer Stats &amp; Activity</text>
    <line x1="25" y1="55" x2="355" y2="55" stroke="#334155" stroke-width="1"/>

    <!-- Stat items -->
    <g transform="translate(25, 90)">
      <circle cx="12" cy="0" r="10" fill="#1E293B" stroke="#2563EB" stroke-width="1.5"/>
      <text x="12" y="4" fill="#60A5FA" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">JS</text>
      <text x="35" y="4" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Total Commits (2026)</text>
      <text x="330" y="4" fill="#38BDF8" font-family="monospace" font-size="15" font-weight="bold" text-anchor="end">450+</text>
    </g>

    <g transform="translate(25, 140)">
      <circle cx="12" cy="0" r="10" fill="#1E293B" stroke="#7C3AED" stroke-width="1.5"/>
      <text x="12" y="4" fill="#A78BFA" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">🧠</text>
      <text x="35" y="4" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">DSA Problems Solved</text>
      <text x="330" y="4" fill="#C084FC" font-family="monospace" font-size="15" font-weight="bold" text-anchor="end">250+</text>
    </g>

    <g transform="translate(25, 190)">
      <circle cx="12" cy="0" r="10" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="12" y="4" fill="#22D3EE" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">🚀</text>
      <text x="35" y="4" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">MERN &amp; AI Repositories</text>
      <text x="330" y="4" fill="#22D3EE" font-family="monospace" font-size="15" font-weight="bold" text-anchor="end">15+</text>
    </g>

    <g transform="translate(25, 240)">
      <circle cx="12" cy="0" r="10" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
      <text x="12" y="4" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">⭐</text>
      <text x="35" y="4" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Contributions &amp; PRs</text>
      <text x="330" y="4" fill="#34D399" font-family="monospace" font-size="15" font-weight="bold" text-anchor="end">Top 10%</text>
    </g>
  </g>

  <!-- Card 2: Top Languages Breakdown (Right) -->
  <g transform="translate(445, 25)">
    <rect width="380" height="310" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1.5"/>
    
    <text x="25" y="40" fill="#A78BFA" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" filter="url(#glow)">📊 Language Proficiency</text>
    <line x1="25" y1="55" x2="355" y2="55" stroke="#334155" stroke-width="1"/>

    <!-- Bar 1: JavaScript -->
    <g transform="translate(25, 80)">
      <text x="0" y="0" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">JavaScript / React / Node</text>
      <text x="330" y="0" fill="#FBBF24" font-family="monospace" font-size="13" font-weight="bold" text-anchor="end">45%</text>
      <rect x="0" y="10" width="330" height="10" rx="5" fill="#1E293B"/>
      <rect x="0" y="10" width="148" height="10" rx="5" fill="#FBBF24" filter="url(#glow)"/>
    </g>

    <!-- Bar 2: Java / C++ (DSA) -->
    <g transform="translate(25, 135)">
      <text x="0" y="0" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Java &amp; Data Structures</text>
      <text x="330" y="0" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="end">30%</text>
      <rect x="0" y="10" width="330" height="10" rx="5" fill="#1E293B"/>
      <rect x="0" y="10" width="99" height="10" rx="5" fill="url(#blueCyan)" filter="url(#glow)"/>
    </g>

    <!-- Bar 3: Python (AI) -->
    <g transform="translate(25, 190)">
      <text x="0" y="0" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Python &amp; AI / ML</text>
      <text x="330" y="0" fill="#A78BFA" font-family="monospace" font-size="13" font-weight="bold" text-anchor="end">15%</text>
      <rect x="0" y="10" width="330" height="10" rx="5" fill="#1E293B"/>
      <rect x="0" y="10" width="50" height="10" rx="5" fill="url(#purplePink)" filter="url(#glow)"/>
    </g>

    <!-- Bar 4: HTML & CSS -->
    <g transform="translate(25, 245)">
      <text x="0" y="0" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">HTML5 / Tailwind CSS</text>
      <text x="330" y="0" fill="#34D399" font-family="monospace" font-size="13" font-weight="bold" text-anchor="end">10%</text>
      <rect x="0" y="10" width="330" height="10" rx="5" fill="#1E293B"/>
      <rect x="0" y="10" width="33" height="10" rx="5" fill="url(#greenTeal)" filter="url(#glow)"/>
    </g>
  </g>
</svg>
