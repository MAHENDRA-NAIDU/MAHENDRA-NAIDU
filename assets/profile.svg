<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#7C3AED" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseRing {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.03); opacity: 1; }
      }
      .ring { transform-origin: center; animation: spin 20s linear infinite; }
      .pulse-bg { transform-origin: center; animation: pulseRing 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="30" fill="#0B0F19"/>
  <circle cx="200" cy="200" r="180" fill="url(#avatarGlow)" class="pulse-bg"/>

  <!-- Rotating Neon Outer Ring -->
  <circle class="ring" cx="200" cy="200" r="145" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="20 10 40 10" filter="url(#glow)"/>

  <!-- Inner Glass Card -->
  <circle cx="200" cy="200" r="130" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="2"/>

  <!-- Stylized Developer Initials Logo & Code Icon -->
  <!-- Floating Code Brackets -->
  <text x="130" y="215" fill="#38BDF8" font-family="monospace" font-size="52" font-weight="bold" filter="url(#glow)">&lt;</text>
  <text x="270" y="215" fill="#38BDF8" font-family="monospace" font-size="52" font-weight="bold" text-anchor="end" filter="url(#glow)">/&gt;</text>

  <!-- Centered Initials MN -->
  <g transform="translate(200, 195)" text-anchor="middle">
    <text y="0" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="42" font-weight="900" letter-spacing="3">MN</text>
    <text y="30" fill="#A78BFA" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="2">DEV PROFILE</text>
  </g>

  <!-- Bottom Verification Badge Pill -->
  <g transform="translate(200, 310)">
    <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="-55" cy="0" r="4" fill="#10B981" filter="url(#glow)"/>
    <text x="5" y="4" fill="#A7F3D0" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">VERIFIED DEV</text>
  </g>
</svg>
